<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESCHER | Serial Query</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="https://cf.aibomart.com/%E6%89%98%E7%AE%A1%E7%AB%99%E7%82%B9/ascher/escher-logo.jpg" sizes="16x16">
<style>
  /* ==================== Pagefind 搜索样式（搜索框水平居中版） ==================== */
.search-container {
    position: relative;
    margin: 0 auto;                    /* 水平居中 */
    z-index: 1001;
    min-width: 200px;
    max-width: 380px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#pagefind-search .pagefind-ui__search-input {
    padding: 10px 16px;
    border: 2px solid #ddd;
    border-radius: 25px;
    font-size: 16px;
    width: 300px;                      /* 固定宽度，避免 focus 时晃动 */
    max-width: 100%;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    background: white;
    color: #333;
    box-sizing: border-box;
    outline: none;
}

#pagefind-search .pagefind-ui__search-input:focus {
    border-color: #4a6fa5;
    box-shadow: 0 0 0 4px rgba(74, 111, 165, 0.2);
}

#pagefind-search .pagefind-ui__results {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);       /* 关键：实现下拉菜单居中 */
    width: 380px;
    max-height: 70vh;
    overflow-y: auto;
    margin-top: 8px;
    z-index: 1000;
    padding: 8px 0;
}

#pagefind-search .pagefind-ui__result { padding: 12px 16px; border-bottom: 1px solid #eee; transition: background-color 0.2s; }
#pagefind-search .pagefind-ui__result:last-child { border-bottom: none; }
#pagefind-search .pagefind-ui__result:hover { background-color: #f8f9ff; }
#pagefind-search .pagefind-ui__result-title { font-size: 15px; font-weight: 600; color: #1f2937; margin-bottom: 4px; }
#pagefind-search .pagefind-ui__result-link { color: #3B82F6; text-decoration: none; }
#pagefind-search .pagefind-ui__result-link:hover { text-decoration: underline; }
#pagefind-search .pagefind-ui__result-excerpt { font-size: 13.5px; color: #666; line-height: 1.5; margin-top: 4px; }
.pagefind-ui__result-excerpt mark { background: #dbeafe; color: #1e40af; padding: 1px 3px; border-radius: 3px; }
#pagefind-search .pagefind-ui__message { padding: 20px; text-align: center; color: #666; font-size: 14px; }
  
</style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← 返回首页 / Back</a>
          <h1>编号查询 / Serial Query</h1>
        <div class="search-container">
            <div id="pagefind-search"></div>
        </div>
    </div>
    <!-- 先加载Pagefind脚本 -->
    <script src="post/pagefind/pagefind.js"></script>
    <!-- 然后加载自定义脚本 -->
    <script src="scripts.js"></script>
    <!-- Pagefind 搜索脚本 -->
<script src="/post/pagefind/pagefind-ui.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', function () {
        console.log("Initializing Pagefind search...");
        try {
            new PagefindUI({
                element: "#pagefind-search",
                showImages: false,
                showSubResults: true,
                resetStyles: false,
                translations: {
                    placeholder: "搜索资源、教程、工具..."
                }
            });
            console.log("Pagefind search initialized successfully");
        } catch (error) {
            console.error("Pagefind search initialization failed:", error);
        }
    });
</script>
</body>
</html>
